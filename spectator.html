<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Scrabble · OBS</title>
    <link rel="stylesheet" href="styles.css?v=22" />
    <link rel="stylesheet" href="effects.css?v=22" />
    <link rel="stylesheet" href="stage.css?v=22" />
    <link rel="stylesheet" href="spectator.css?v=22" />
  </head>
  <body class="spectator in-game">
    <div class="spectator-backdrop" id="spectatorBackdrop" aria-hidden="true"></div>
    <div class="spectator-wait" id="spectatorWait">
      <section class="card">
        <h1>🎥 Pokémon Scrabble · OBS</h1>
        <p id="spectatorStatus" role="status">Ingresa el código de la sala de tu partida.</p>
        <form id="spectatorCodeForm">
          <input class="select" id="spectatorCode" aria-label="Código de sala" placeholder="ABCDE" maxlength="5" required />
          <button class="btn btn-primary" type="submit">Ver partida</button>
        </form>
        <p class="muted">Cámaras más altas y transparentes por dentro, con el fondo original en el resto de la pantalla. Mantén abierta la pantalla principal de la partida.</p>
      </section>
    </div>
    <main>
      <section id="screenGame" class="screen game" hidden aria-label="Partida en modo espectador">
        <div class="stage-layout" id="stageLayout" data-cams="0">
          <div class="cam-col cam-left" id="camLeft"></div>
          <div class="play-area" id="playArea">
            <div class="board-frame" id="boardFrame"><div class="board-wrap" id="boardWrap"></div></div>
            <div class="board3d" id="board3dWrap" hidden><div class="board3d-canvas" id="board3dCanvas"></div></div>
            <header class="hud-top" id="hudTop"><div class="hud-turn" id="hudTurn" aria-live="polite"></div></header>
            <div class="hud-plaques" id="hudPlaques"></div>
            <div class="hud-bottom" id="hudBottom" hidden><p class="spectator-preview" id="spectatorPreview" aria-live="polite"></p></div>
            <p class="spectator-connection" id="spectatorConnection" role="status" hidden></p>
          </div>
          <div class="cam-col cam-right" id="camRight"></div>
        </div>
      </section>
    </main>
    <script src="pokedex.js?v=22"></script>
    <script src="rules.js?v=22"></script>
    <script src="live-view.js?v=22"></script>
    <script src="dom.js?v=22"></script>
    <script src="board-view.js?v=22"></script>
    <script src="hud.js?v=22"></script>
    <script src="cams.js?v=22"></script>
    <script src="net-protocol.js?v=22"></script>
    <script src="vendor/peerjs.min.js"></script>
    <script src="spectator.js?v=22"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/",
          "./view3d/board3d.js": "./view3d/board3d.js?v=22",
          "./view3d/camera.js": "./view3d/camera.js?v=22",
          "./view3d/companions.js": "./view3d/companions.js?v=22",
          "./view3d/fx.js": "./view3d/fx.js?v=22",
          "./view3d/mouse.js": "./view3d/mouse.js?v=22",
          "./view3d/particles.js": "./view3d/particles.js?v=22",
          "./view3d/racks.js": "./view3d/racks.js?v=22",
          "./view3d/scenery.js": "./view3d/scenery.js?v=22",
          "./view3d/seats.js": "./view3d/seats.js?v=22",
          "./view3d/stage.js": "./view3d/stage.js?v=22",
          "./view3d/textures.js": "./view3d/textures.js?v=22",
          "./view3d/tiles.js": "./view3d/tiles.js?v=22",
          "./view3d/townmodels.js": "./view3d/townmodels.js?v=22",
          "./view3d/tween.js": "./view3d/tween.js?v=22",
          "./view3d/view3d.js": "./view3d/view3d.js?v=22"
        }
      }
    </script>
    <script type="module" src="view3d/view3d.js?v=22"></script>
  </body>
</html>
